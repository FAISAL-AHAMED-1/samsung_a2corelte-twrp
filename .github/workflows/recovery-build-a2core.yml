name: Recovery Build (A2 Core)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
      MANIFEST_BRANCH:
        description: 'Manifest Branch (use twrp-9.0 for A2 Core)'
        required: true
        default: 'twrp-9.0'
      DEVICE_TREE_URL:
        description: 'Your Device Tree URL'
        required: true
        default: 'https://github.com/FAISAL-AHAMED-1/samsung_a2corelte-twrp'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'twrp-9.0'
      DEVICE_PATH:
        description: 'Device Path inside source'
        required: true
        default: 'device/samsung/a2corelte'
      DEVICE_TREE_COMMIT:
        description: 'Pinned Device Tree Commit'
        required: true
        default: '1c6a83d22464438aa08e0333bbea85d5eb73d831'
      RECOVERY_REPO_URL:
        description: 'Pinned Recovery Fork URL'
        required: true
        default: 'https://github.com/FAISAL-AHAMED-1/android_bootable_recovery.git'
      RECOVERY_COMMIT:
        description: 'Pinned Recovery Commit'
        required: true
        default: '524167f5316bc4a57480cddeb9782b11cf436d46'
      COMMON_TREE_URL:
        description: 'Common Tree URL (leave blank if none)'
        required: false
      COMMON_PATH:
        description: 'Common Path (leave blank if none)'
        required: false
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'a2corelte'
      MAKEFILE_NAME:
        description: 'Lunch Makefile Name'
        required: true
        default: 'omni_a2corelte'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::Build Parameters"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Tree Commit: ${{ github.event.inputs.DEVICE_TREE_COMMIT }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Recovery Fork: ${{ github.event.inputs.RECOVERY_REPO_URL }}"
        echo "Recovery Commit: ${{ github.event.inputs.RECOVERY_COMMIT }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare Build Environment
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq             linux-modules-extra-$(uname -r)             gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib             libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils             xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev             libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools             imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3 tar

    - name: Install OpenJDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: |
        startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') ||
        startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
        startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com')
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/local/bin/repo

    - name: Initialize Repo
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle
      working-directory: workspace

    - name: Pin Recovery Source
      run: |
        test -d bootable/recovery
        git -C bootable/recovery fetch --no-tags ${{ github.event.inputs.RECOVERY_REPO_URL }} ${{ github.event.inputs.RECOVERY_COMMIT }}
        git -C bootable/recovery checkout --detach ${{ github.event.inputs.RECOVERY_COMMIT }}
        test "$(git -C bootable/recovery rev-parse HEAD)" = "${{ github.event.inputs.RECOVERY_COMMIT }}"
        echo "Recovery source pinned:"
        git -C bootable/recovery log -1 --oneline
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone and Pin Device Tree
      run: |
        git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ./${{ github.event.inputs.DEVICE_PATH }}
        git fetch --no-tags origin ${{ github.event.inputs.DEVICE_TREE_COMMIT }}
        git checkout --detach ${{ github.event.inputs.DEVICE_TREE_COMMIT }}
        test "$(git rev-parse HEAD)" = "${{ github.event.inputs.DEVICE_TREE_COMMIT }}"
        echo "Device tree source pinned:"
        git log -1 --oneline
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone Common Tree
      if: |
        github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != ''
      run: |
        git clone --depth=1 ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Switch to Python 2
      run: |
        sudo apt-get install -y python2
        sudo rm -f /usr/bin/python
        sudo ln -s /usr/bin/python2 /usr/bin/python
      continue-on-error: true

    - name: Build Recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Validate Recovery Image
      run: |
        python3 - <<'PY2'
        import os
        import struct
        import sys

        device = "${{ github.event.inputs.DEVICE_NAME }}"
        target = "${{ github.event.inputs.BUILD_TARGET }}"
        image = os.path.join("out", "target", "product", device, target + ".img")

        MAX_RAMDISK = 13661699

        if not os.path.isfile(image):
            print("ERROR: recovery image not found:", image)
            sys.exit(1)

        with open(image, "rb") as f:
            header = f.read(2048)

        if header[:8] != b"ANDROID!":
            print("ERROR: not a classic Android boot image")
            print("Magic:", repr(header[:8]))
            sys.exit(1)

        kernel_size = struct.unpack_from("<I", header, 8)[0]
        ramdisk_size = struct.unpack_from("<I", header, 16)[0]
        second_size = struct.unpack_from("<I", header, 24)[0]
        page_size = struct.unpack_from("<I", header, 36)[0]
        dt_size = struct.unpack_from("<I", header, 40)[0]

        image_size = os.path.getsize(image)

        print("===== RECOVERY IMAGE VALIDATION =====")
        print("Image:       ", image)
        print("Image size:  ", image_size)
        print("Kernel size: ", kernel_size)
        print("Ramdisk size:", ramdisk_size)
        print("Second size: ", second_size)
        print("DT size:     ", dt_size)
        print("Page size:   ", page_size)
        print("Hard maximum:", MAX_RAMDISK)
        print("Margin:      ", MAX_RAMDISK - ramdisk_size)
        print("NOTE: ramdisk-size limit check disabled; image will be slimmed locally.")

        recovery_commit = "${{ github.event.inputs.RECOVERY_COMMIT }}"
        actual_recovery = os.popen("git -C bootable/recovery rev-parse HEAD").read().strip()

        if actual_recovery != recovery_commit:
            print("ERROR: recovery source commit mismatch")
            print("Expected:", recovery_commit)
            print("Actual:  ", actual_recovery)
            sys.exit(1)

        device_tree = "${{ github.event.inputs.DEVICE_PATH }}"
        device_commit = "${{ github.event.inputs.DEVICE_TREE_COMMIT }}"
        actual_device = os.popen("git -C " + device_tree + " rev-parse HEAD").read().strip()

        if actual_device != device_commit:
            print("ERROR: device-tree commit mismatch")
            print("Expected:", device_commit)
            print("Actual:  ", actual_device)
            sys.exit(1)

        print("OK: recovery source commit verified")
        print("OK: device-tree commit verified")
        print("===== VALIDATION PASSED =====")
        PY2
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          **Device:** ${{ github.event.inputs.DEVICE_NAME }}
          **Manifest:** ${{ github.event.inputs.MANIFEST_BRANCH }}
          **Target:** ${{ github.event.inputs.BUILD_TARGET }}.img
          **Built by:** GitHub Actions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
